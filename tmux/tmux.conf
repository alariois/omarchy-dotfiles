# Personal tmux configuration.
#
# Sourced from ~/.config/tmux/tmux.conf by a managed block that
# setup/install.sh maintains. Omarchy owns that file; everything of ours
# lives here so an `omarchy update` can never overwrite more than the block.

# prefix-k killed windows next to prefix-c/prefix-r, which cost real work more
# than once. Nothing rebinds it -- `x` kills the pane, prefix-K the session.
unbind k

# The wheel scrolls the pane you are working in, not the one the pointer is
# lying on.
#
# With `mouse on` (Omarchy's default) tmux routes a wheel event by pointer
# position, so after moving panes with Alt+hjkl the wheel scrolls whatever the
# mouse happens to be parked over -- usually the pane you just left.
#
# What this can and cannot fix, because the line falls in an awkward place:
#
#   plain pane (a shell)     retargeted. tmux's own copy-mode scrolling takes
#                            a -t, so the scroll goes to the active pane.
#   full-screen or mouse-    left exactly as stock. `send-keys -M` forwards the
#   aware app (nvim, a TUI)  actual mouse event, and it ignores -t -- verified
#                            against an nvim with mouse=a, which scrolls when
#                            the pointer is over it and does not when the event
#                            is aimed at it from elsewhere. Only the pointer
#                            being physically inside the pane can drive those,
#                            which is the one thing this is here to avoid.
#
# So the rule is: if the *active* pane handles the mouse itself, behave exactly
# as tmux always did; otherwise scroll the active pane wherever the pointer is.
#
# `:.+0` is the pane at offset 0 from the active one. It matters that it is not
# `:` or `.`: inside a mouse binding tmux resolves "current" from the mouse
# event, so those name the pane under the pointer. The +/- pane offsets are
# reckoned from the active pane instead, which is the only spelling that
# escapes the mouse context.
#
# The condition cannot use -t for the same reason in reverse. `if -F -t X`
# retargets the commands in both its branches, which would turn the stock
# `send-keys -M` into the no-op described above -- so the active pane is
# inspected with a #{P:...} pane loop, which needs no target at all.
bind -n WheelUpPane if -F '#{P:#{?#{&&:#{pane_active},#{||:#{alternate_on},#{mouse_any_flag}}},x,}}' {
  send-keys -M
} {
  if -F -t ':.+0' '#{pane_in_mode}' {
    send-keys -X -t ':.+0' -N 3 scroll-up
  } {
    copy-mode -e -t ':.+0'
  }
}

bind -n WheelDownPane if -F '#{P:#{?#{&&:#{pane_active},#{||:#{alternate_on},#{mouse_any_flag}}},x,}}' {
  send-keys -M
} {
  if -F -t ':.+0' '#{pane_in_mode}' {
    send-keys -X -t ':.+0' -N 3 scroll-down
  } {
    send-keys -M
  }
}
