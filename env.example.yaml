# env.example.yaml -- the shape of env.yaml, with made-up values.
#
# env.yaml holds this machine's accounts and their secrets. It is gitignored
# and encrypted; this file is its tracked twin, so a new machine knows what
# goes in it. Keep the two in step: a key added to or removed from env.yaml
# belongs here too, with a placeholder value -- never a real one, and never a
# real client name, because this repo is public. The pre-commit hook and
# `env-secrets check` compare the two.
#
#   env-secrets init     # creates env.yaml from this file and encrypts it
#   env-secrets edit     # fills it in
#
# Each entry's `name` is what aws-select and az-select show. Its profile name
# is the same folded to lower-case-and-dashes: "Acme Prod" is acme-prod.
# `prod: true` marks a production account: shown in red, and switching to it
# asks first (--yes skips the question).

aws:
  # An IAM user with access keys of its own.
  - name: Acme Prod
    prod: true
    email: root-account@example.com
    account_id: "111111111111"   # quoted: a number would lose leading zeros
    region: eu-north-1
    access_key_id: AKIAIOSFODNN7EXAMPLE      # the placeholder pair from AWS's own docs
    secret_access_key: wJalrXUtnFEMI/K7MDENG/bPxRfiCYEXAMPLEKEY

  # A role assumed with another entry's keys: one key pair to protect, and
  # every session expires on its own. `source` is that entry's name.
  - name: Acme Staging
    email: staging-account@example.com
    account_id: "222222222222"
    region: eu-north-1
    role_arn: arn:aws:iam::222222222222:role/Admin
    source: Acme Prod

azure:
  # A service principal: an app registration with a client secret and a role
  # (Owner, for everything) on the subscription.
  - name: Example Corp
    prod: false
    email: you@example.com
    tenant_id: 00000000-0000-0000-0000-000000000000
    subscription_id: 11111111-1111-1111-1111-111111111111
    client_id: 22222222-2222-2222-2222-222222222222
    client_secret: example~client~secret~value~0000000000
    secret_expires: "2027-10-01"   # when to make a new one; doctor.sh warns ahead
