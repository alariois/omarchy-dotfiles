# Gmail over IMAP, for scripting.
#
# Linked to ~/.config/himalaya/config.toml by setup/install.sh. Omarchy ships
# nothing under ~/.config/himalaya, so this file is ours outright -- a link,
# not a hook.
#
# No secret lives here. The app password sits in gnome-keyring and is fetched
# by the command at the bottom, so this file stays safe in a public repo.
#
# To set it up on a new machine:
#
#   1. Google account -> Security -> 2-Step Verification -> App passwords
#      (https://myaccount.google.com/apppasswords). App passwords only exist
#      once 2-Step Verification is on.
#   2. secret-tool store --label="Gmail app password (himalaya)" \
#        service himalaya account alari.ois.ao@gmail.com
#      It reads the password from stdin and stores nothing on disk in cleartext.
#   3. himalaya account check
#
# The schema below was read out of himalaya 2.1's own parser rather than from
# a blog post; `himalaya json-schema <dir>` dumps the JSON shape of every
# command's output, which is what the mail-last helper is written against.

[accounts.gmail]
default = true
email = "alari.ois.ao@gmail.com"
display-name = "Alari"

# Without this, every command that touches a mailbox demands an explicit
# --mailbox and fails with "Mailbox is required" otherwise -- including a bare
# `himalaya envelope list`.
[accounts.gmail.mailbox.alias]
inbox = "INBOX"

[accounts.gmail.imap]
# Implicit TLS on 993. Gmail also offers STARTTLS on 143; there is no reason
# to prefer it.
server = "imap.gmail.com:993"

[accounts.gmail.imap.sasl.plain]
username = "alari.ois.ao@gmail.com"

# `cmd`, never `raw`: raw would put the app password in this file, and this
# repository is public.
[accounts.gmail.imap.sasl.plain.passwd]
cmd = "secret-tool lookup service himalaya account alari.ois.ao@gmail.com"

# Work mail, hosted by Zone.ee (superhands.ee has MX zonemx.eu and
# SPF include:_spf.zone.eu).
#
# Zone publishes no autoconfig -- neither the Thunderbird ISPDB nor
# autoconfig.superhands.ee has an entry -- so these were read off the server
# itself. imap.zone.eu:993 answers with a cert valid for exactly that name and
# advertises:
#
#   * CAPABILITY IMAP4rev1 ... AUTH=PLAIN AUTH=PLAIN-CLIENTTOKEN ... SASL-IR
#
# So plain SASL over implicit TLS, same shape as the Gmail account above. No
# OAuth involved. mail.zone.eu and mail.superhands.ee do not resolve; do not
# guess them back in.
#
# NOTE: reading this account directly is currently pointless. Gmail POP-fetches
# this mailbox (Settings -> Accounts and Import -> "Check mail from other
# accounts") with "Leave a copy of retrieved message on the server" turned OFF,
# so it deletes each message from Zone once it has it. Measured on 2026-08-28:
# Inbox holds 0 messages while its UIDNEXT is 23482, i.e. ~23k messages have
# passed through and been drained. Junk (9), Trash (406) and Sent Mail (2) are
# untouched, which is why the account is still worth having configured.
#
# So incoming superhands.ee mail is read through the `gmail` account, where POP
# delivers it:
#
#   himalaya envelope search "to superhands.ee"
#
# Tick "Leave a copy" in Gmail if you would rather read it here directly, with
# no POP delay.
#
# The secret is the Zone mailbox password:
#
#   secret-tool store --label="Zone mail (himalaya)" \
#     service himalaya account alari@superhands.ee

[accounts.superhands]
email = "alari@superhands.ee"
display-name = "Alari"

[accounts.superhands.mailbox.alias]
inbox = "Inbox"

[accounts.superhands.imap]
server = "imap.zone.eu:993"

[accounts.superhands.imap.sasl.plain]
username = "alari@superhands.ee"

[accounts.superhands.imap.sasl.plain.passwd]
cmd = "secret-tool lookup service himalaya account alari@superhands.ee"
