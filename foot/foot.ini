# Personal foot settings.
#
# Included from ~/.config/foot/foot.ini by setup/install.sh. Omarchy owns that
# file, so ours is a separate one it includes last -- foot lets a later
# assignment win, which is what makes these override the stock values above.
#
# foot re-reads its config only when a terminal starts, so existing windows
# keep the old font until they are restarted.

[main]
# The NL ("no ligatures") mono cut, as on `main`. Stock Omarchy uses
# JetBrainsMono Nerd Font, which ligates -> and != in source.
#
# Omarchy does not ship this family; setup/install.sh's FONTS lane unpacks it
# into ~/.local/share/fonts. If that ever fails, fontconfig silently falls back
# to something else rather than erroring, so doctor.sh checks the family
# resolves instead of trusting this line.
font=JetBrainsMonoNL Nerd Font Mono:size=9
